name: GTFS静的データ自動更新

on:
  schedule:
    # 毎月1日 3:00 JST (前月18:00 UTC)
    - cron: '0 18 1 * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: GTFS取得・stops.json生成
        run: node scripts/update-gtfs.mjs

      - name: index.htmlに注入
        run: node scripts/build.mjs

      - name: 変更があればcommit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stops.json index.html
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: GTFS静的データ更新 $(date +%Y-%m)"
            git push
          fi